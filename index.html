<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>极简跳转</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        :root {
            --bubble-duration: 1s;
        }
        body {
            height: 100vh;
            padding: 40px 20px;
            text-align: center;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #ffffff;
        }
        .bg-wrap {
            position: fixed;
            inset: 0;
            z-index: -1;
            background: #ffffff;
            transition: background 0.3s ease;
            overflow: hidden;
        }
        body.bg-black .bg-wrap {
            background: #000000;
        }
        .bubble {
            position: absolute;
            width: 100%;
            height: 100%;
            --bubble-size: 50%;
            will-change: transform;
            transform: translate3d(0, 0, 0);
            backface-visibility: hidden;
            transition: transform var(--bubble-duration) ease-in-out;
        }
        .bubble:nth-child(1) { background: radial-gradient(circle, rgba(255, 180, 210, 0.55), transparent var(--bubble-size)); }
        .bubble:nth-child(2) { background: radial-gradient(circle, rgba(160, 210, 255, 0.55), transparent var(--bubble-size)); }
        .bubble:nth-child(3) { background: radial-gradient(circle, rgba(210, 180, 255, 0.55), transparent var(--bubble-size)); }
        .bubble:nth-child(4) { background: radial-gradient(circle, rgba(255, 235, 180, 0.55), transparent var(--bubble-size)); }
        .bubble:nth-child(5) { background: radial-gradient(circle, rgba(180, 255, 210, 0.55), transparent var(--bubble-size)); }
        .bubble:nth-child(6) { background: radial-gradient(circle, rgba(255, 120, 180, 0.55), transparent var(--bubble-size)); }
        .bubble:nth-child(7) { background: radial-gradient(circle, rgba(120, 220, 255, 0.55), transparent var(--bubble-size)); }

        .view-page {
            max-width: 440px;
            width: 100%;
            margin: 0 auto;
            position: absolute;
            left: 0;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            opacity: 0;
            pointer-events: none;
            z-index: 1;
            will-change: opacity;
        }
        .view-page.active {
            opacity: 1;
            pointer-events: auto;
            z-index: 2;
        }

        .card {
            background: rgba(255, 255, 255, 0.20);
            border: 1px solid rgba(255, 255, 255, 0.20);
            border-radius: 28px;
            padding: 40px 30px;
            backdrop-filter: blur(38px) saturate(60%);
            -webkit-backdrop-filter: blur(38px) saturate(60%);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.06);
            transition: background 0.3s ease, border-color 0.3s ease;
        }
        .title {
            font-size: 26px;
            color: #111111;
            margin-bottom: 36px;
            font-weight: 500;
            letter-spacing: 0.5px;
        }
        body.bg-black .title { color: #ffffff; }
        .col-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 22px;
        }

        .btn-jump,
        .btn-declare {
            background: #3B82F6;
            color: #ffffff;
            border: none;
            border-radius: 24px;
            padding: 24px 32px;
            font-size: 24px;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
            transition: 0.25s ease;
            box-shadow: 0 8px 28px rgba(59, 130, 246, 0.35);
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            position: relative;
            overflow: hidden;
            -webkit-touch-callout: none;
            user-select: none;
        }
        .btn-jump:active,
        .btn-declare:active {
            transform: scale(0.96);
            box-shadow: 0 4px 16px rgba(59, 130, 246, 0.25);
        }
        .btn-jump .arrow {
            display: inline-block;
            transition: transform 0.25s ease;
        }
        .btn-jump:hover .arrow {
            transform: translateX(6px);
        }

        .setting-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.08);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 0, 0, 0.12);
            color: #111111;
            font-size: 22px;
            cursor: pointer;
            transition: background 0.3s ease, color 0.3s ease, transform 0.2s ease, opacity 0.15s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.10);
            -webkit-touch-callout: none;
            user-select: none;
        }
        .setting-btn:active { transform: scale(0.92); }
        body.bg-black .setting-btn {
            background: rgba(255, 255, 255, 0.22);
            border-color: rgba(255, 255, 255, 0.18);
            color: #ffffff;
        }
        .setting-btn.anim-hidden {
            opacity: 0;
            pointer-events: none;
        }

        .morph-ball {
            position: fixed;
            z-index: 10000;
            display: none;
            background: rgba(255, 255, 255, 0.30);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.10);
            border: 1px solid rgba(255, 255, 255, 0.25);
            pointer-events: none;
            contain: layout style paint;
            transform: translateZ(0);
        }
        .morph-ball::before {
            content: '';
            position: absolute;
            inset: 0;
            background: var(--morph-color, #3B82F6);
            opacity: 1;
            transition: opacity var(--fade-duration, 0ms) ease;
            border-radius: inherit;
            pointer-events: none;
        }
        .morph-ball.fade-color::before {
            opacity: 0;
        }
        body.bg-black .morph-ball {
            background: rgba(0, 0, 0, 0.35);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 9999;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.08);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 0, 0, 0.12);
            color: #111111;
            font-size: 24px;
            cursor: pointer;
            transition: background 0.3s ease, color 0.3s ease, transform 0.2s ease, opacity 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.10);
            -webkit-touch-callout: none;
            user-select: none;
            opacity: 0;
            pointer-events: none;
        }
        .back-btn.visible {
            opacity: 1;
            pointer-events: auto;
        }
        .back-btn:active { transform: scale(0.92); }
        body.bg-black .back-btn {
            background: rgba(255, 255, 255, 0.22);
            border-color: rgba(255, 255, 255, 0.18);
            color: #ffffff;
        }

        .set-card {
            max-height: 78vh;
            overflow-y: auto;
            text-align: left;
            position: relative;
            scrollbar-width: none;
            -ms-overflow-style: none;
            -webkit-overflow-scrolling: touch;
        }
        .set-card::-webkit-scrollbar { display: none; }
        .set-card .title { text-align: center; margin-bottom: 24px; }

        .announce-content {
            font-size: 15px;
            line-height: 1.8;
            color: #111111;
            white-space: pre-wrap;
            word-break: break-word;
            transition: color 0.3s ease;
        }
        body.bg-black .announce-content { color: #ffffff; }

        .slider-row { margin: 18px 0; }
        .slider-row label {
            display: block;
            font-size: 14px;
            margin-bottom: 8px;
            color: #111111;
            transition: color 0.3s ease;
            font-weight: 450;
        }
        body.bg-black .slider-row label { color: #ffffff; }

        .slider-track {
            position: relative;
            width: 100%;
            height: 24px;
            border-radius: 999px;
            background: rgba(0, 0, 0, 0.08);
            transition: background 0.3s ease;
        }
        body.bg-black .slider-track {
            background: rgba(255, 255, 255, 0.15);
        }
        .slider-fill {
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 0%;
            background: #1989fa;
            border-radius: 999px;
            pointer-events: none;
            z-index: 1;
        }
        .slider-row input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            position: relative;
            z-index: 2;
            width: 100%;
            height: 22px;
            margin-top: 1px;
            border-radius: 999px;
            outline: none;
            cursor: pointer;
            background: transparent;
            box-sizing: border-box;
            padding: 0;
            border: none;
            touch-action: pan-y;
        }
        .slider-row input[type="range"]::-webkit-slider-runnable-track {
            height: 22px;
            background: transparent;
            border-radius: 999px;
            border: none;
        }
        .slider-row input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: #ffffff;
            border: 2px solid #1989fa;
            margin-top: 0;
            position: relative;
            z-index: 4;
            box-sizing: border-box;
        }
        .slider-row input[type="range"]::-moz-range-thumb {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: #ffffff;
            border: 2px solid #1989fa;
            box-sizing: border-box;
        }
        .slider-row input[type="range"]::-moz-range-track {
            height: 22px;
            background: transparent;
            border-radius: 999px;
            border: none;
        }
        .slider-row [data-key] {
            cursor: text;
            display: inline-block;
            min-width: 36px;
            text-align: center;
            color: inherit;
            font-weight: 500;
        }

        .music-row { margin: 6px 0 4px; }
        .btn-toggle {
            width: 100%;
            padding: 18px 20px;
            border-radius: 18px;
            border: none;
            font-size: 20px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.25s;
            background: #3B82F6;
            color: #ffffff;
            box-shadow: 0 8px 28px rgba(59, 130, 246, 0.35);
            letter-spacing: 1px;
        }
        .btn-toggle:active { transform: scale(0.97); }
        .btn-toggle.off {
            background: rgba(0, 0, 0, 0.08);
            color: #666666;
            box-shadow: none;
        }
        body.bg-black .btn-toggle.off {
            background: rgba(255, 255, 255, 0.12);
            color: #aaaaaa;
        }

        .btn-enter {
            width: 100%;
            padding: 18px 22px;
            border-radius: 18px;
            border: none;
            font-size: 18px;
            font-weight: 550;
            cursor: pointer;
            background: rgba(0, 0, 0, 0.06);
            color: #111111;
            transition: 0.2s;
            margin: 18px 0 4px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            letter-spacing: 0.5px;
        }
        .btn-enter:active { transform: scale(0.97); }
        body.bg-black .btn-enter {
            background: rgba(255, 255, 255, 0.12);
            color: #ffffff;
        }
        .btn-enter .chev { font-size: 20px; opacity: 0.6; }

        .bg-switch { margin: 16px 0; display: flex; gap: 12px; }
        .bg-switch button {
            flex: 1;
            padding: 10px;
            border-radius: 14px;
            border: none;
            cursor: pointer;
            font-size: 15px;
            font-weight: 500;
            transition: 0.2s;
        }
        .bg-switch button:active { transform: scale(0.96); }
        .btn-black { background: #000000; color: #ffffff; }
        .btn-white { background: #ffffff; color: #000000; }

        .reset-btn { margin-top: 20px; }
        .btn-gray {
            background: rgba(0, 0, 0, 0.08);
            color: #111111;
            border: none;
            border-radius: 20px;
            padding: 16px 26px;
            font-size: 18px;
            width: 100%;
            cursor: pointer;
            transition: 0.2s;
            font-weight: 450;
        }
        .btn-gray:active { transform: scale(0.97); }
        body.bg-black .btn-gray {
            background: rgba(255, 255, 255, 0.25);
            color: #ffffff;
        }

        @media (max-width: 480px) {
            .card { padding: 30px 20px; }
            .btn-jump, .btn-declare { font-size: 20px; padding: 20px 24px; }
            .setting-btn, .back-btn { width: 44px; height: 44px; font-size: 18px; top: 14px; }
            .setting-btn { right: 14px; }
            .back-btn { left: 14px; }
        }
    </style>
</head>
<body>
    <div class="bg-wrap">
        <div class="bubble"></div><div class="bubble"></div><div class="bubble"></div>
        <div class="bubble"></div><div class="bubble"></div><div class="bubble"></div><div class="bubble"></div>
    </div>

    <audio id="bgMusic" src="./music.mp3" preload="auto" loop></audio>

    <div class="morph-ball" id="morphBall"></div>

    <button class="back-btn" id="backBtn" aria-label="返回">←</button>
    <button class="setting-btn" id="goSetting" aria-label="设置">⚙</button>

    <div class="view-page active" id="page-home">
        <div class="card">
            <div class="title">✨ 欢迎</div>
            <div class="col-center">
                <button class="btn-declare" id="declareBtn">📄 声明</button>
                <button class="btn-jump" id="jumpBtn">
                    <span>立即前往</span>
                    <span class="arrow">→</span>
                </button>
            </div>
        </div>
    </div>

    <div class="view-page" id="page-setting">
        <div class="card set-card">
            <div class="title">⚙ 设置</div>

            <div class="music-row">
                <button id="musicToggle" class="btn-toggle">🎵 音乐：开启</button>
            </div>

            <div class="slider-row">
                <label>音量 <span id="valMusicVol" data-key="musicVol">100</span>%</label>
                <div class="slider-track">
                    <div class="slider-fill" id="fillMusicVol"></div>
                    <input type="range" min="0" max="100" step="1" id="inpMusicVol" value="100">
                </div>
            </div>

            <button class="btn-enter" id="goDisplay">
                <span>🎨 画面设置</span><span class="chev">›</span>
            </button>

            <div class="bg-switch">
                <button id="toggleBg" class="btn-black">切换背景</button>
            </div>

            <div class="col-center reset-btn">
                <button class="btn-gray" id="resetDefault">恢复默认</button>
            </div>
        </div>
    </div>

    <div class="view-page" id="page-display">
        <div class="card set-card">
            <div class="title">🎨 画面设置</div>

            <div class="slider-row">
                <label>毛玻璃不透明度 <span id="valBgAlpha" data-key="bgAlpha">0.20</span></label>
                <div class="slider-track">
                    <div class="slider-fill" id="fillBgAlpha"></div>
                    <input type="range" min="0" max="1" step="0.001" id="inpBgAlpha" value="0.20">
                </div>
            </div>
            <div class="slider-row">
                <label>阴影透明度 (0.01~1.00) <span id="valShadow" data-key="shadowAlpha">0.06</span></label>
                <div class="slider-track">
                    <div class="slider-fill" id="fillShadow"></div>
                    <input type="range" min="0.01" max="1" step="0.001" id="inpShadow" value="0.06">
                </div>
            </div>
            <div class="slider-row">
                <label>泡泡缩放 scale (0.1~10) 最小: <span id="valScaleMin" data-key="scaleMin">1.0</span> &nbsp; 最大: <span id="valScaleMax" data-key="scaleMax">2.5</span></label>
                <div class="slider-track">
                    <div class="slider-fill" id="fillScaleMin"></div>
                    <input type="range" min="0.1" max="10" step="0.001" id="inpScaleMin" value="1">
                </div>
                <div class="slider-track" style="margin-top:10px;">
                    <div class="slider-fill" id="fillScaleMax"></div>
                    <input type="range" min="0.1" max="10" step="0.001" id="inpScaleMax" value="2.5">
                </div>
            </div>
            <div class="slider-row">
                <label>translate 最大范围 (0%~300%) <span id="valTrans" data-key="transRange">30</span>%</label>
                <div class="slider-track">
                    <div class="slider-fill" id="fillTrans"></div>
                    <input type="range" min="0" max="300" step="0.1" id="inpTrans" value="30">
                </div>
            </div>
            <div class="slider-row">
                <label>泡泡大小 (0%~100%) <span id="valBubbleSize" data-key="bubbleSize">50</span>%</label>
                <div class="slider-track">
                    <div class="slider-fill" id="fillBubbleSize"></div>
                    <input type="range" min="0" max="100" step="0.1" id="inpBubbleSize" value="50">
                </div>
            </div>
            <div class="slider-row">
                <label>泡泡运动速度 (0.2~10s) <span id="valBubbleTime" data-key="bubbleSec">1.00</span>s</label>
                <div class="slider-track">
                    <div class="slider-fill" id="fillBubbleTime"></div>
                    <input type="range" min="0.2" max="10" step="0.01" id="inpBubbleTime" value="1">
                </div>
            </div>
            <div class="slider-row">
                <label>页面切换过渡时长 (0~2.5s) <span id="valPageTrans" data-key="pageTransSec">0.60</span>s</label>
                <div class="slider-track">
                    <div class="slider-fill" id="fillPageTrans"></div>
                    <input type="range" min="0" max="2.5" step="0.001" id="inpPageTrans" value="0.6">
                </div>
            </div>
        </div>
    </div>

    <div class="view-page" id="page-announce">
        <div class="card set-card">
            <div class="title">📄 声明</div>
            <div class="announce-content">在这里填写你的声明文字。

你可以写多行，比如：
1. 本页面仅为个人使用，不构成任何商业服务。
2. 跳转链接的内容与本页面作者无关。
3. 如有疑问，请联系作者。

（把这段文字替换成你自己的内容即可）</div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const jumpBtn = document.getElementById('jumpBtn');
            if (jumpBtn) {
                jumpBtn.addEventListener('click', () => {
                    const url = "https://www.bilibili.com";
                    const win = window.open(url, "_blank");
                    if (!win || win.closed || typeof win.closed === 'undefined') {
                        window.location.href = url;
                    }
                });
            }

            const declareBtn = document.getElementById('declareBtn');
            if (declareBtn) {
                declareBtn.addEventListener('click', () => {
                    animateButtonToPage(declareBtn, 'page-announce');
                });
            }

            const settingBtn = document.getElementById('goSetting');
            if (settingBtn) {
                settingBtn.addEventListener('click', () => {
                    const sp = document.getElementById('page-setting');
                    const dp = document.getElementById('page-display');
                    const ap = document.getElementById('page-announce');
                    
                    if (sp.classList.contains("active")) {
                        animatePageToButton(settingBtn, 'page-setting');
                    } else if (dp.classList.contains("active")) {
                        switchMainView("page-setting");
                    } else if (ap.classList.contains("active")) {
                        switchMainView("page-setting");
                    } else {
                        animateButtonToPage(settingBtn, 'page-setting');
                    }
                });
            }

            const backBtn = document.getElementById('backBtn');
            if (backBtn) {
                backBtn.addEventListener('click', () => {
                    const dp = document.getElementById('page-display');
                    const sp = document.getElementById('page-setting');
                    const ap = document.getElementById('page-announce');
                    if (dp.classList.contains("active")) {
                        switchMainView("page-setting");
                    } else if (ap.classList.contains("active")) {
                        animatePageToButton(declareBtn, 'page-announce');
                    } else if (sp.classList.contains("active")) {
                        animatePageToButton(settingBtn, 'page-setting');
                    }
                });
            }

            let displayTipShown = false;
            const goDisplayBtn = document.getElementById('goDisplay');
            if (goDisplayBtn) {
                goDisplayBtn.addEventListener('click', () => {
                    if (!displayTipShown) {
                        displayTipShown = true;
                        alert('点击数字可呼出输入法修改数字');
                    }
                    switchMainView("page-display");
                });
            }

            const resetBtn = document.getElementById('resetDefault');
            if (resetBtn) resetBtn.addEventListener('click', () => {
                Object.assign(config, DEFAULT_CONFIG);
                const updateList = [
                    ['BgAlpha', 'bgAlpha', v => v.toFixed(2)],
                    ['Shadow', 'shadowAlpha', v => v.toFixed(2)],
                    ['ScaleMin', 'scaleMin', v => v.toFixed(1)], ['ScaleMax', 'scaleMax', v => v.toFixed(1)],
                    ['Trans', 'transRange', v => v.toFixed(0)], ['BubbleSize', 'bubbleSize', v => v.toFixed(1)],
                    ['BubbleTime', 'bubbleSec', v => v.toFixed(2)], ['PageTrans', 'pageTransSec', v => v.toFixed(2)]
                ];
                updateList.forEach(([name, key, fmt]) => {
                    const inp = document.getElementById('inp' + name);
                    const val = document.getElementById('val' + name);
                    if (inp && val) { inp.value = config[key]; val.textContent = fmt(config[key]); updateSliderFill(inp); }
                });
                const inpMusicVol = document.getElementById('inpMusicVol');
                const valMusicVol = document.getElementById('valMusicVol');
                if (inpMusicVol && valMusicVol) { inpMusicVol.value = config.musicVol; valMusicVol.textContent = config.musicVol; updateSliderFill(inpMusicVol); }
                applyVolume();
                applyBackground("#ffffff");
                updateCardStyle(); updateBubbleSize(); restartBubbleAnim();
            });

            const musicToggle = document.getElementById('musicToggle');
            if (musicToggle) {
                musicToggle.addEventListener('click', () => {
                    musicEnabled = !musicEnabled;
                    updateMusicButton();
                    if (musicEnabled) { applyVolume(); audio.play().catch(() => {}); } else { audio.pause(); }
                });
            }

            const toggleBg = document.getElementById('toggleBg');
            if (toggleBg) {
                toggleBg.addEventListener('click', () => {
                    if (config.bgColor === "#000000") applyBackground("#ffffff");
                    else applyBackground("#000000");
                });
            }

            setTimeout(() => {
                alert('记得看右上角的设置按钮啊！！！');
                setTimeout(() => {
                    alert('音乐已经默认开启，可到右上角设置关闭');
                }, 3000);
            }, 100);

            initBubbles();
            initSliders();
            applyBackground("#ffffff");
            updateMusicButton();
            applyVolume();
            playMusic();

            document.addEventListener('pointerup', resumeBubbleAnim);
            document.addEventListener('pointercancel', resumeBubbleAnim);

            window.addEventListener('resize', () => {
                document.querySelectorAll('input[type="range"]').forEach(inp => {
                    inp._trackWidth = 0;
                    updateSliderFill(inp);
                });
            });
        });

        const paramsMeta = {
            bgAlpha: { min: 0, max: 1, fixed: 2 },
            shadowAlpha: { min: 0.01, max: 1, fixed: 2 },
            scaleMin: { min: 0.1, max: 10, fixed: 1 }, scaleMax: { min: 0.1, max: 10, fixed: 1 },
            transRange: { min: 0, max: 300, fixed: 1 }, bubbleSize: { min: 0, max: 100, fixed: 1 },
            bubbleSec: { min: 0.2, max: 10, fixed: 2 }, pageTransSec: { min: 0, max: 2.5, fixed: 2 }
        };

        const DEFAULT_CONFIG = {
            bgAlpha: 0.20, shadowAlpha: 0.06, scaleMin: 1, scaleMax: 2.5,
            transRange: 30, bubbleSize: 50, bubbleSec: 1, 
            pageTransSec: 0.6,  // 默认时长从 0.3s 改为 0.6s，让动画清晰可见
            bgColor: "#ffffff", musicVol: 100
        };
        const config = { ...DEFAULT_CONFIG };

        const allViews = document.querySelectorAll(".view-page");
        const bgWrap = document.querySelector(".bg-wrap");
        const audio = document.getElementById("bgMusic");
        const backBtn = document.getElementById('backBtn');

        let musicEnabled = true;
        let bubbleTimer = null;
        let isDragging = false;
        let animLock = false;

        function pauseBubbleAnim() {
            if (bubbleTimer) { clearInterval(bubbleTimer); bubbleTimer = null; }
            isDragging = true;
        }
        function resumeBubbleAnim() {
            if (!isDragging) return;
            isDragging = false;
            setTimeout(() => { if (!isDragging) restartBubbleAnim(); }, 50);
        }

        // ============================================================
        // 动画时序（提高最小值，确保动画清晰可见）
        // ============================================================
        function getAnimTiming() {
            // 把滑块值(0~2.5s)映射到 500ms ~ 2500ms 的实际动画时长
            // 默认 0.6s → 600ms（morph 330ms + colorFade 150ms + fadeIn 120ms）
            const rawMs = config.pageTransSec * 1000;
            const totalMs = Math.min(Math.max(rawMs, 500), 2500);
            return {
                total: totalMs,
                morph: Math.round(totalMs * 0.55),
                colorFade: Math.round(totalMs * 0.25),
                fadeIn: Math.round(totalMs * 0.20)
            };
        }

        function getBtnRadius(btn, btnRect) {
            const computed = getComputedStyle(btn).borderRadius;
            if (computed.includes('%')) {
                return btnRect.width / 2;
            }
            return parseFloat(computed) || 0;
        }

        function getButtonColor(btn) {
            const style = getComputedStyle(btn);
            return style.backgroundColor;
        }

        function saveCardVisual(card) {
            return {
                background: card.style.background,
                border: card.style.border,
                backdropFilter: card.style.backdropFilter,
                webkitBackdropFilter: card.style.webkitBackdropFilter,
                boxShadow: card.style.boxShadow
            };
        }
        function hideCardVisual(card) {
            card.style.background = 'transparent';
            card.style.border = '1px solid transparent';
            card.style.backdropFilter = 'none';
            card.style.webkitBackdropFilter = 'none';
            card.style.boxShadow = 'none';
        }
        function restoreCardVisual(card, saved) {
            card.style.background = saved.background;
            card.style.border = saved.border;
            card.style.backdropFilter = saved.backdropFilter;
            card.style.webkitBackdropFilter = saved.webkitBackdropFilter;
            card.style.boxShadow = saved.boxShadow;
        }

        // ============================================================
        // 按钮 → 页面
        // ============================================================
        function animateButtonToPage(btn, targetPageId) {
            if (animLock) return;
            animLock = true;

            const ball = document.getElementById('morphBall');
            const home = document.getElementById('page-home');
            const targetPage = document.getElementById(targetPageId);
            const targetCard = targetPage.querySelector('.card');
            const contents = Array.from(targetCard.children);

            const btnRect = btn.getBoundingClientRect();
            const cardRect = targetCard.getBoundingClientRect();
            const timing = getAnimTiming();
            const btnColor = getButtonColor(btn);

            const btnRadius = getBtnRadius(btn, btnRect);
            const cardRadius = 28;

            pauseBubbleAnim();

            home.style.transition = `opacity ${Math.round(timing.morph * 0.5)}ms ease`;
            home.style.opacity = '0';
            btn.classList.add('anim-hidden');

            targetPage.classList.add('active');
            targetPage.style.opacity = '1';
            targetPage.style.pointerEvents = 'none';
            targetPage.style.zIndex = '3';
            const savedCardVisual = saveCardVisual(targetCard);
            hideCardVisual(targetCard);
            contents.forEach(el => {
                el.style.transition = 'none';
                el.style.opacity = '0';
            });

            ball.style.setProperty('--morph-color', btnColor);
            ball.style.setProperty('--fade-duration', '0ms');
            ball.classList.remove('fade-color');
            ball.style.display = 'block';
            ball.style.transition = 'none';
            ball.style.top = btnRect.top + 'px';
            ball.style.left = btnRect.left + 'px';
            ball.style.width = btnRect.width + 'px';
            ball.style.height = btnRect.height + 'px';
            ball.style.borderRadius = btnRadius + 'px';

            ball.style.willChange = 'width, height, top, left, border-radius';

            void ball.offsetWidth;

            // 阶段 1：变形
            requestAnimationFrame(() => {
                ball.style.transition = `top ${timing.morph}ms cubic-bezier(0.34, 1.05, 0.64, 1), left ${timing.morph}ms cubic-bezier(0.34, 1.05, 0.64, 1), width ${timing.morph}ms cubic-bezier(0.34, 1.05, 0.64, 1), height ${timing.morph}ms cubic-bezier(0.34, 1.05, 0.64, 1), border-radius ${timing.morph}ms cubic-bezier(0.4, 0, 0.2, 1)`;
                ball.style.top = cardRect.top + 'px';
                ball.style.left = cardRect.left + 'px';
                ball.style.width = cardRect.width + 'px';
                ball.style.height = cardRect.height + 'px';
                ball.style.borderRadius = cardRadius + 'px';
            });

            // 阶段 2：颜色褪去
            setTimeout(() => {
                ball.style.setProperty('--fade-duration', timing.colorFade + 'ms');
                ball.classList.add('fade-color');

                // 阶段 3：内容浮现
                setTimeout(() => {
                    ball.style.display = 'none';
                    ball.style.willChange = '';
                    ball.classList.remove('fade-color');

                    restoreCardVisual(targetCard, savedCardVisual);

                    contents.forEach(el => {
                        el.style.transition = `opacity ${timing.fadeIn}ms ease`;
                        el.style.opacity = '1';
                    });

                    setTimeout(() => {
                        targetPage.style.pointerEvents = 'auto';
                        targetPage.style.zIndex = '';
                        home.classList.remove('active');
                        home.style.opacity = '';
                        home.style.transition = '';
                        contents.forEach(el => {
                            el.style.transition = '';
                            el.style.opacity = '';
                        });

                        if (backBtn) backBtn.classList.add('visible');
                        animLock = false;
                        resumeBubbleAnim();

                        requestAnimationFrame(() => {
                            targetPage.querySelectorAll('input[type="range"]').forEach(inp => {
                                inp._trackWidth = 0;
                                updateSliderFill(inp);
                            });
                        });
                    }, timing.fadeIn);
                }, timing.colorFade);
            }, timing.morph);
        }

        // ============================================================
        // 页面 → 按钮
        // ============================================================
        function animatePageToButton(btn, sourcePageId) {
            if (animLock) return;
            animLock = true;

            const ball = document.getElementById('morphBall');
            const home = document.getElementById('page-home');
            const sourcePage = document.getElementById(sourcePageId);
            const sourceCard = sourcePage.querySelector('.card');
            const contents = Array.from(sourceCard.children);

            const btnRect = btn.getBoundingClientRect();
            const cardRect = sourceCard.getBoundingClientRect();
            const timing = getAnimTiming();
            const btnColor = getButtonColor(btn);

            const btnRadius = getBtnRadius(btn, btnRect);
            const cardRadius = 28;

            pauseBubbleAnim();

            contents.forEach(el => {
                el.style.transition = `opacity ${timing.fadeIn}ms ease`;
                el.style.opacity = '0';
            });

            if (backBtn) backBtn.classList.remove('visible');

            setTimeout(() => {
                const savedCardVisual = saveCardVisual(sourceCard);
                hideCardVisual(sourceCard);

                ball.style.setProperty('--morph-color', btnColor);
                ball.style.setProperty('--fade-duration', '0ms');
                ball.classList.remove('fade-color');
                ball.style.display = 'block';
                ball.style.transition = 'none';
                ball.style.top = cardRect.top + 'px';
                ball.style.left = cardRect.left + 'px';
                ball.style.width = cardRect.width + 'px';
                ball.style.height = cardRect.height + 'px';
                ball.style.borderRadius = cardRadius + 'px';
                ball.style.willChange = 'width, height, top, left, border-radius';

                void ball.offsetWidth;

                requestAnimationFrame(() => {
                    ball.style.transition = `top ${timing.morph}ms cubic-bezier(0.4, 0, 0.2, 1), left ${timing.morph}ms cubic-bezier(0.4, 0, 0.2, 1), width ${timing.morph}ms cubic-bezier(0.4, 0, 0.2, 1), height ${timing.morph}ms cubic-bezier(0.4, 0, 0.2, 1), border-radius ${timing.morph}ms cubic-bezier(0.4, 0, 0.2, 1)`;
                    ball.style.top = btnRect.top + 'px';
                    ball.style.left = btnRect.left + 'px';
                    ball.style.width = btnRect.width + 'px';
                    ball.style.height = btnRect.height + 'px';
                    ball.style.borderRadius = btnRadius + 'px';
                });

                sourcePage.style.transition = `opacity ${timing.morph}ms ease`;
                sourcePage.style.opacity = '0';

                setTimeout(() => {
                    ball.style.display = 'none';
                    ball.style.willChange = '';
                    btn.classList.remove('anim-hidden');
                    restoreCardVisual(sourceCard, savedCardVisual);

                    home.classList.add('active');
                    home.style.transition = 'none';
                    home.style.opacity = '0';
                    void home.offsetWidth;
                    home.style.transition = `opacity ${timing.fadeIn}ms ease`;
                    home.style.opacity = '1';

                    setTimeout(() => {
                        sourcePage.classList.remove('active');
                        sourcePage.style.transition = '';
                        sourcePage.style.opacity = '';
                        sourcePage.style.pointerEvents = '';
                        contents.forEach(el => {
                            el.style.transition = '';
                            el.style.opacity = '';
                        });
                        home.style.transition = '';
                        home.style.opacity = '';

                        animLock = false;
                        resumeBubbleAnim();
                    }, timing.fadeIn);
                }, timing.morph);
            }, timing.fadeIn);
        }

        // ============================================================
        // 普通页面切换（提高最小时长）
        // ============================================================
        function switchMainView(targetId) {
            const currentActive = document.querySelector('.view-page.active');
            const targetEl = document.getElementById(targetId);
            if (currentActive === targetEl) return;

            pauseBubbleAnim();

            // 最小时长从 200ms 提高到 400ms
            const duration = Math.min(Math.max(config.pageTransSec * 1000, 400), 1500);

            if (currentActive) {
                currentActive.style.transition = `opacity ${duration}ms ease`;
                currentActive.style.opacity = '0';
                currentActive.classList.remove('active');
                currentActive.style.pointerEvents = 'none';
                setTimeout(() => {
                    currentActive.style.opacity = '';
                    currentActive.style.transition = '';
                }, duration);
            }

            targetEl.style.transition = 'none';
            targetEl.style.opacity = '0';
            targetEl.classList.add('active');
            targetEl.style.pointerEvents = 'auto';
            void targetEl.offsetWidth;
            targetEl.style.transition = `opacity ${duration}ms ease`;
            targetEl.style.opacity = '1';

            setTimeout(() => {
                targetEl.style.transition = '';
                targetEl.style.opacity = '';
                requestAnimationFrame(() => {
                    targetEl.querySelectorAll('input[type="range"]').forEach(inp => {
                        inp._trackWidth = 0;
                        updateSliderFill(inp);
                    });
                });
                resumeBubbleAnim();
            }, duration);

            if (backBtn) {
                if (targetId === 'page-home') {
                    backBtn.classList.remove('visible');
                } else {
                    backBtn.classList.add('visible');
                }
            }
        }

        function updateMusicButton() {
            const btn = document.getElementById('musicToggle');
            if (!btn) return;
            if (musicEnabled) {
                btn.classList.remove("off");
                btn.textContent = "🎵 音乐：开启";
            } else {
                btn.classList.add("off");
                btn.textContent = "🔇 音乐：关闭";
            }
        }

        function applyVolume() {
            if (audio) audio.volume = config.musicVol / 100;
        }

        function playMusic() {
            if (!audio || !musicEnabled) return;
            applyVolume();
            audio.play().catch(() => {
                const oncePlay = () => {
                    if (musicEnabled && audio) audio.play().catch(() => {});
                    document.removeEventListener('click', oncePlay);
                };
                document.addEventListener('click', oncePlay, { once: true });
            });
        }

        audio.addEventListener('error', () => {
            console.warn("音乐文件加载失败。请确保 music.mp3 与 HTML 文件在同一目录下。");
            musicEnabled = false;
            updateMusicButton();
        });

        function updateBubbleDuration() {
            document.documentElement.style.setProperty('--bubble-duration', config.bubbleSec + 's');
        }
        function animateBubble(bubble) {
            const r = config.transRange;
            const x = (Math.random() * r * 2 - r) + "%";
            const y = (Math.random() * r * 2 - r) + "%";
            const s = config.scaleMin + Math.random() * (config.scaleMax - config.scaleMin);
            bubble.style.transform = `translate3d(${x},${y},0) scale(${s})`;
        }
        function restartBubbleAnim() {
            if (bubbleTimer) clearInterval(bubbleTimer);
            updateBubbleDuration();
            document.querySelectorAll(".bubble").forEach(bub => animateBubble(bub));
            bubbleTimer = setInterval(() => { document.querySelectorAll(".bubble").forEach(bub => animateBubble(bub)); }, config.bubbleSec * 1000);
        }

        function initBubbles() {
            document.querySelectorAll(".bubble").forEach(bub => {
                bub.style.transition = 'none';
                animateBubble(bub);
            });
            void document.body.offsetHeight;
            document.querySelectorAll(".bubble").forEach(bub => { bub.style.transition = ''; });
            restartBubbleAnim();
        }

        function updateCardStyle() {
            const bg = `rgba(255,255,255,${config.bgAlpha})`;
            const filter = `blur(38px) saturate(60%)`;
            const shadow = `0 8px 32px rgba(0,0,0,${config.shadowAlpha})`;
            document.querySelectorAll('.view-page.active .card').forEach(card => {
                card.style.background = bg;
                card.style.border = `1px solid ${bg}`;
                card.style.backdropFilter = filter;
                card.style.webkitBackdropFilter = filter;
                card.style.boxShadow = shadow;
            });
        }

        function updateBubbleSize() {
            document.querySelectorAll(".bubble").forEach(bub => { bub.style.setProperty('--bubble-size', config.bubbleSize + '%'); });
        }

        function applyBackground(color) {
            config.bgColor = color;
            bgWrap.style.background = color;
            const toggleBg = document.getElementById('toggleBg');
            if (color === "#ffffff") {
                document.body.classList.remove("bg-black");
                if (toggleBg) toggleBg.className = "btn-black";
            } else {
                document.body.classList.add("bg-black");
                if (toggleBg) toggleBg.className = "btn-white";
            }
            requestAnimationFrame(() => {
                document.querySelectorAll('input[type="range"]').forEach(inp => {
                    inp._trackWidth = 0;
                    updateSliderFill(inp);
                });
            });
        }

        function updateSliderFill(slider) {
            if (!slider) return;
            const min = parseFloat(slider.min);
            const max = parseFloat(slider.max);
            const val = parseFloat(slider.value);
            const percent = Math.max(0, Math.min(100, ((val - min) / (max - min)) * 100));

            const thumbWidth = 22;
            
            let trackWidth = slider._trackWidth;
            if (!trackWidth || trackWidth === 0) {
                trackWidth = slider.offsetWidth;
                if (trackWidth > 0) {
                    slider._trackWidth = trackWidth;
                }
            }

            let visualPercent = percent;
            if (trackWidth > 0) {
                const fillWidth = thumbWidth + (trackWidth - thumbWidth) * (percent / 100);
                visualPercent = (fillWidth / trackWidth) * 100;
            }

            const trackEl = slider.closest('.slider-track');
            if (trackEl) {
                const fillEl = trackEl.querySelector('.slider-fill');
                if (fillEl) {
                    fillEl.style.width = visualPercent + '%';
                }
            }
        }

        function bindSlider(inpId, valId, cfgKey, formatFn) {
            const inp = document.getElementById(inpId);
            const valSpan = document.getElementById(valId);
            if (!inp || !valSpan) return;
            
            const isOnThumb = (clientX) => {
                const rect = inp.getBoundingClientRect();
                const x = clientX - rect.left;
                const min = parseFloat(inp.min);
                const max = parseFloat(inp.max);
                const val = parseFloat(inp.value);
                const percent = (val - min) / (max - min);
                const thumbWidth = 22;
                const thumbLeft = (rect.width - thumbWidth) * percent;
                return x >= thumbLeft - 10 && x <= thumbLeft + thumbWidth + 10;
            };
            
            let touchingSlot = false;
            let savedValue = null;
            
            const onPointerDown = (e) => {
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                if (!isOnThumb(clientX)) {
                    touchingSlot = true;
                    savedValue = inp.value;
                }
                pauseBubbleAnim();
            };
            
            inp.addEventListener('pointerdown', onPointerDown);
            inp.addEventListener('touchstart', onPointerDown, { passive: true });
            inp.addEventListener('mousedown', onPointerDown);
            
            const clearTouch = () => {
                touchingSlot = false;
                savedValue = null;
            };
            document.addEventListener('pointerup', clearTouch);
            document.addEventListener('pointercancel', clearTouch);
            
            let rafPending = false;
            inp.addEventListener("input", () => {
                if (touchingSlot && savedValue !== null) {
                    inp.value = savedValue;
                    updateSliderFill(inp);
                    return;
                }
                
                const val = Number(inp.value);
                config[cfgKey] = val;
                valSpan.textContent = formatFn ? formatFn(val) : val.toFixed(2);
                updateSliderFill(inp);
                
                if (!rafPending) {
                    rafPending = true;
                    requestAnimationFrame(() => {
                        rafPending = false;
                        if (cfgKey === 'bubbleSec') restartBubbleAnim();
                        else if (cfgKey === 'bubbleSize') updateBubbleSize();
                        else if (cfgKey === 'musicVol') applyVolume();
                        else updateCardStyle();
                    });
                }
            });
            
            updateSliderFill(inp);
        }

        function initSliders() {
            bindSlider("inpBgAlpha", "valBgAlpha", "bgAlpha", v => v.toFixed(2));
            bindSlider("inpShadow", "valShadow", "shadowAlpha", v => v.toFixed(2));
            bindSlider("inpTrans", "valTrans", "transRange", v => v.toFixed(0));
            bindSlider("inpBubbleSize", "valBubbleSize", "bubbleSize", v => v.toFixed(1));
            bindSlider("inpBubbleTime", "valBubbleTime", "bubbleSec", v => v.toFixed(2));
            bindSlider("inpPageTrans", "valPageTrans", "pageTransSec", v => v.toFixed(2));
            bindSlider("inpMusicVol", "valMusicVol", "musicVol", v => v.toFixed(0));

            const inpScaleMin = document.getElementById("inpScaleMin");
            const inpScaleMax = document.getElementById("inpScaleMax");
            const valScaleMin = document.getElementById("valScaleMin");
            const valScaleMax = document.getElementById("valScaleMax");

            if (inpScaleMin && inpScaleMax && valScaleMin && valScaleMax) {
                const bindScaleSlider = (inp, isMin) => {
                    const isOnThumb = (clientX) => {
                        const rect = inp.getBoundingClientRect();
                        const x = clientX - rect.left;
                        const min = parseFloat(inp.min);
                        const max = parseFloat(inp.max);
                        const val = parseFloat(inp.value);
                        const percent = (val - min) / (max - min);
                        const thumbWidth = 22;
                        const thumbLeft = (rect.width - thumbWidth) * percent;
                        return x >= thumbLeft - 10 && x <= thumbLeft + thumbWidth + 10;
                    };
                    
                    let touchingSlot = false;
                    let savedValue = null;
                    
                    const onPointerDown = (e) => {
                        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                        if (!isOnThumb(clientX)) {
                            touchingSlot = true;
                            savedValue = inp.value;
                        }
                        pauseBubbleAnim();
                    };
                    
                    inp.addEventListener('pointerdown', onPointerDown);
                    inp.addEventListener('touchstart', onPointerDown, { passive: true });
                    inp.addEventListener('mousedown', onPointerDown);
                    
                    document.addEventListener('pointerup', () => {
                        touchingSlot = false;
                        savedValue = null;
                    });
                    document.addEventListener('pointercancel', () => {
                        touchingSlot = false;
                        savedValue = null;
                    });
                    
                    inp.addEventListener("input", () => {
                        if (touchingSlot && savedValue !== null) {
                            inp.value = savedValue;
                            updateSliderFill(inp);
                            return;
                        }
                        
                        let min = Number(inpScaleMin.value);
                        let max = Number(inpScaleMax.value);
                        if (min >= max) {
                            if (isMin) {
                                min = Number((max - 0.001).toFixed(3));
                                inp.value = min;
                            } else {
                                max = Number((min + 0.001).toFixed(3));
                                inp.value = max;
                            }
                        }
                        config.scaleMin = min;
                        config.scaleMax = max;
                        valScaleMin.textContent = min.toFixed(1);
                        valScaleMax.textContent = max.toFixed(1);
                        updateSliderFill(inpScaleMin);
                        updateSliderFill(inpScaleMax);
                    });
                    
                    updateSliderFill(inp);
                };
                
                bindScaleSlider(inpScaleMin, true);
                bindScaleSlider(inpScaleMax, false);
            }

            document.querySelectorAll('[data-key]').forEach(span => bindEditEvent(span));

            function bindEditEvent(span) {
                span.addEventListener('click', function handler() {
                    const key = this.dataset.key;
                    const meta = paramsMeta[key];
                    if (!meta) return;
                    const oldVal = config[key];
                    const input = document.createElement('input');
                    input.type = 'number'; input.step = 'any'; input.min = meta.min; input.max = meta.max;
                    input.value = oldVal;
                    input.style.cssText = `width:60px;text-align:center;background:rgba(255,255,255,0.2);border:1px solid rgba(255,255,255,0.3);border-radius:6px;color:inherit;padding:2px 4px;font-size:14px;outline:none;`;
                    this.replaceWith(input); input.focus(); input.select();
                    const commit = () => {
                        let newVal = parseFloat(input.value);
                        if (isNaN(newVal)) newVal = oldVal;
                        newVal = Math.max(meta.min, Math.min(meta.max, newVal));
                        newVal = Number(newVal.toFixed(meta.fixed));
                        config[key] = newVal;
                        const inpId = 'inp' + key.charAt(0).toUpperCase() + key.slice(1);
                        const inpEl = document.getElementById(inpId);
                        if (inpEl) { inpEl.value = newVal; updateSliderFill(inpEl); }
                        const newSpan = document.createElement('span');
                        newSpan.id = this.id; newSpan.dataset.key = key;
                        newSpan.textContent = newVal.toFixed(meta.fixed);
                        bindEditEvent(newSpan);
                        input.replaceWith(newSpan);
                        if (key === 'scaleMin' && config.scaleMin >= config.scaleMax) {
                            config.scaleMax = Number((config.scaleMin + 0.001).toFixed(3));
                            const el = document.getElementById('inpScaleMax');
                            if (el) { el.value = config.scaleMax; updateSliderFill(el); }
                            const vEl = document.getElementById('valScaleMax');
                            if (vEl) vEl.textContent = config.scaleMax.toFixed(paramsMeta.scaleMax.fixed);
                        }
                        if (key === 'scaleMax' && config.scaleMin >= config.scaleMax) {
                            config.scaleMin = Number((config.scaleMax - 0.001).toFixed(3));
                            const el = document.getElementById('inpScaleMin');
                            if (el) { el.value = config.scaleMin; updateSliderFill(el); }
                            const vEl = document.getElementById('valScaleMin');
                            if (vEl) vEl.textContent = config.scaleMin.toFixed(paramsMeta.scaleMin.fixed);
                        }
                        if (key === 'bubbleSec') restartBubbleAnim();
                        else if (key === 'bubbleSize') updateBubbleSize();
                        else if (key === 'musicVol') applyVolume();
                        else updateCardStyle();
                    };
                    input.addEventListener('blur', commit);
                    input.addEventListener('keydown', e => {
                        if (e.key === 'Enter') input.blur();
                        if (e.key === 'Escape') { input.value = oldVal; input.blur(); }
                    });
                });
            }
        }
    </script>
</body>
